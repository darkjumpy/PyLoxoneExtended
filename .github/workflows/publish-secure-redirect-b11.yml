name: Publish PyLoxone Extended b11 prerelease (secure HTTPS redirects)

on:
  push:
    branches: [release/secure-https-redirect-2026.11.0b11]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pyloxone-2026-11-0b11
  cancel-in-progress: false

jobs:
  validate-and-publish:
    if: github.repository == 'darkjumpy/PyLoxoneExtended'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Verify b11 manifest and syntax
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q custom_components/loxone tests
          python - <<'PY'
          from pathlib import Path
          import json
          root = Path('custom_components/loxone')
          assert json.loads((root / 'manifest.json').read_text())['version'] == '2026.11.0b11'
          assert Path('docs/release-2026.11.0b11.md').exists()
          http = (root / 'pyloxone_api' / 'loxone_http_client.py').read_text()
          conn = (root / 'pyloxone_api' / 'connection.py').read_text()
          assert 'def _validated_loxone_https_redirect(' in http
          assert 'self.verify_ssl = True' in http
          assert 'if connector.upgraded_https:' in conn
          print('b11 metadata and syntax OK')
          PY

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Test HTTPS redirect and reconnect recovery
        run: |
          python -m pytest -q \
            tests/test_https_redirect_recovery.py \
            tests/test_reconnect_recovery.py \
            tests/test_connection_unit.py \
            tests/test_config_flow_reauth.py

      - name: Publish b11 pre-release without overwriting previous tags
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG='2026.11.0b11'
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists; refusing to overwrite"
            exit 1
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::Tag $TAG already exists; refusing to move"
            exit 1
          fi
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "PyLoxone Extended 2026.11.0b11 — Secure HTTPS redirects" \
            --notes-file docs/release-2026.11.0b11.md \
            --prerelease \
            --latest=false
          ACTUAL="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '.object.sha')"
          if [[ "$ACTUAL" != "$GITHUB_SHA" ]]; then
            echo "::error::Release tag mismatch: $ACTUAL != $GITHUB_SHA"
            exit 1
          fi
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json tagName,isPrerelease,url --jq '{tag: .tagName, prerelease: .isPrerelease, url: .url}'
