name: Publish Valve Actuator Air b6 prerelease (serial and power hotfix)

on:
  push:
    branches: [feature/air-valve-manual-controls]
    paths:
      - .github/workflows/publish-valve-air-b6.yml

permissions:
  contents: write

jobs:
  publish:
    if: github.repository == 'darkjumpy/PyLoxoneExtended'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify b6 version, syntax, queue and physical Air serial
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast
          import json
          import re
          import xml.etree.ElementTree as ET
          from pathlib import Path
          from types import SimpleNamespace
          manifest = json.loads(Path("custom_components/loxone/manifest.json").read_text(encoding="utf-8"))
          assert manifest["version"] == "2026.11.0b6", manifest["version"]
          assert Path("docs/release-2026.11.0b6.md").is_file()
          p = Path("custom_components/loxone/valve_air.py")
          source = ast.parse(p.read_text(encoding="utf-8"))
          wanted = {"_device_serial", "_air_device_serial", "parse_valve_tech_report"}
          nodes = [node for node in source.body if (
              isinstance(node, ast.FunctionDef) and node.name in wanted
              or isinstance(node, ast.Assign) and any(
                  isinstance(t, ast.Name) and t.id == "_TECH_FIELDS"
                  for t in node.targets
              )
          )]
          assert len(nodes) == 4, len(nodes)
          ns = {"re": re, "ET": ET, "_LOGGER": SimpleNamespace(warning=lambda *a, **kw: None)}
          exec(compile(ast.Module(body=nodes, type_ignores=[]), str(p), "exec"), ns)
          parse = ns["_air_device_serial"]
          assert parse(ET.Element("C", {"IP": "FE80000000000000524F94FFFE000001"})) == "504F94FFFE000001"
          assert parse(ET.Element("C", {"IP": "fe80::524f:94ff:fe00:0002"})) == "504F94FFFE000002"
          assert parse(ET.Element("C", {
              "IP": "FE80000000000000524F94FFFE000001",
              "Serial": "504F94FFFE000002",
          })) is None
          assert parse(ET.Element("C", {"IP": "20010DB800000000524F94FFFE000001"})) is None
          parse_report = ns["parse_valve_tech_report"]
          assert parse_report("BatteryPowered:0;")["battery_powered"] is False
          assert parse_report("BatteryPowered:1;")["battery_powered"] is True
          print("b6 hardware identifier and physical power parser smoke tests passed")
          PY
          python -m compileall -q custom_components/loxone tests
          python -m unittest discover -s tests -p test_air_command_queue_core.py -v

      - name: Correct existing unreleased b6 tag and create prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="2026.11.0b6"
          OLD_REF="f4ab2b6030349747483c49fe3dedcbad6cc62b1c"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists; refusing to overwrite"
            exit 1
          fi
          CURRENT="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '.object.sha')"
          echo "Existing tag: $CURRENT"
          echo "Validated source: $GITHUB_SHA"
          if [[ "$CURRENT" != "$OLD_REF" && "$CURRENT" != "$GITHUB_SHA" ]]; then
            echo "::error::Tag changed unexpectedly; not overwriting $CURRENT"
            exit 1
          fi
          if [[ "$CURRENT" == "$OLD_REF" ]]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$TAG" \
              -f sha="$GITHUB_SHA" -F force=true >/dev/null
          fi
          ACTUAL="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '.object.sha')"
          if [[ "$ACTUAL" != "$GITHUB_SHA" ]]; then
            echo "::error::Tag does not match the validated source commit"
            exit 1
          fi
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "PyLoxone Extended 2026.11.0b6 — Air serial and supply hotfix" \
            --notes-file docs/release-2026.11.0b6.md \
            --prerelease \
            --latest=false
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json tagName,isPrerelease,url --jq '{tag: .tagName, prerelease: .isPrerelease, url: .url}'
