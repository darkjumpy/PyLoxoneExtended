name: Publish Valve Actuator Air b9 prerelease (button event UUIDs)

on:
  push:
    branches: [feature/air-valve-manual-controls]
    paths:
      - .github/workflows/publish-valve-air-b9.yml

permissions:
  contents: write

jobs:
  publish:
    if: github.repository == 'darkjumpy/PyLoxoneExtended'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify b9 version and Air button event mapping tests
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q custom_components/loxone tests
          python -m unittest discover -s tests -p test_air_command_queue_core.py -v
          python -m unittest discover -s tests -p test_air_visualized_controls.py -v
          python -m unittest discover -s tests -p test_air_button_event_map.py -v
          python - <<'PY'
          from pathlib import Path
          import json
          root = Path("custom_components/loxone")
          manifest = json.loads((root/"manifest.json").read_text(encoding="utf-8"))
          assert manifest["version"] == "2026.11.0b9"
          assert Path("docs/release-2026.11.0b9.md").is_file()
          assert "CONF_AIR_BUTTON_EVENT_MAP" in (root/"config_flow.py").read_text()
          assert "parse_air_button_event_map(" in (root/"binary_sensor.py").read_text()
          assert "loxone_air_button_pressed" in (root/"binary_sensor.py").read_text()
          assert "async_drive_to(" not in (root/"number.py").read_text()
          print("Validated b9 button event map, physical entity and no DriveTo controls")
          PY

      - name: Create immutable b9 pre-release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="2026.11.0b9"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists; refusing to overwrite"
            exit 1
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::Tag $TAG already exists; refusing to move it"
            exit 1
          fi
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "PyLoxone Extended 2026.11.0b9 — Air button events" \
            --notes-file docs/release-2026.11.0b9.md \
            --prerelease \
            --latest=false
          ACTUAL="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '.object.sha')"
          if [[ "$ACTUAL" != "$GITHUB_SHA" ]]; then
            echo "::error::Release tag mismatch: $ACTUAL != $GITHUB_SHA"
            exit 1
          fi
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json tagName,isPrerelease,url --jq '{tag: .tagName, prerelease: .isPrerelease, url: .url}'
