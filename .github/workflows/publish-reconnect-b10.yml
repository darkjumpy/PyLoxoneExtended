name: Publish PyLoxone Extended b10 prerelease (restart recovery)

on:
  push:
    branches: [release/reconnect-2026.11.0b10]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pyloxone-2026-11-0b10
  cancel-in-progress: false

jobs:
  validate-and-publish:
    if: github.repository == 'darkjumpy/PyLoxoneExtended'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Verify the pre-release version and files
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q custom_components/loxone tests
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('custom_components/loxone')
          assert json.loads((root / 'manifest.json').read_text())['version'] == '2026.11.0b10'
          assert Path('docs/release-2026.11.0b10.md').is_file()
          code = (root / 'pyloxone_api' / 'connection.py').read_text()
          assert 'AUTHENTICATION_TIMEOUT_SECONDS = 30.0' in code
          assert 'authentication_watchdog()' in code
          assert 'self._reconnect_event.set()' in code
          assert Path('tests/test_reconnect_recovery.py').is_file()
          print('Validated b10 manifest and reconnect recovery files')
          PY

      - name: Install unit test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Run connection and authentication regression tests
        run: |
          python -m pytest -q \
            tests/test_reconnect_recovery.py \
            tests/test_connection_unit.py \
            tests/test_config_flow_reauth.py

      - name: Create b10 pre-release (never overwrite an existing tag)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG='2026.11.0b10'
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists. Refusing to overwrite."
            exit 1
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::Tag $TAG already exists. Refusing to move."
            exit 1
          fi
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "PyLoxone Extended 2026.11.0b10 — Miniserver restart recovery" \
            --notes-file docs/release-2026.11.0b10.md \
            --prerelease \
            --latest=false
          ACTUAL="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '.object.sha')"
          if [[ "$ACTUAL" != "$GITHUB_SHA" ]]; then
            echo "::error::Release tag mismatch: $ACTUAL != $GITHUB_SHA"
            exit 1
          fi
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json tagName,isPrerelease,url --jq '{tag: .tagName, prerelease: .isPrerelease, url: .url}'
