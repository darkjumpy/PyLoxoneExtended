name: Validate Air diagnostic parsers

on:
  push:
    branches: [feature/air-valve-manual-controls]
    paths:
      - .github/workflows/validate-air-diagnostics.yml
      - custom_components/loxone/valve_air.py
      - custom_components/loxone/sensor.py
      - custom_components/loxone/number.py
      - custom_components/loxone/config_flow.py
      - custom_components/loxone/const.py
      - custom_components/loxone/binary_sensor.py
      - custom_components/loxone/air_command_queue.py
      - custom_components/loxone/air_command_queue_core.py
      - tests/test_air_command_queue_core.py
      - tests/test_air_visualized_controls.py
      - custom_components/loxone/manifest.json
      - tests/test_air_valve_extended.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parser-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python syntax and stand-alone XML parser tests
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q custom_components/loxone tests
          python -m unittest discover -s tests -p test_air_command_queue_core.py -v
          python -m unittest discover -s tests -p test_air_visualized_controls.py -v
          python - <<'PY'
          import ast
          import re
          import xml.etree.ElementTree as ET
          from pathlib import Path
          path = Path("custom_components/loxone/valve_air.py")
          source = ast.parse(path.read_text(encoding="utf-8"))
          wanted = {
              "_device_serial",
              "_air_device_serial",
              "tech_report_confirms_awake",
              "parse_device_report_response",
              "parse_drive_to_response",
              "parse_valve_tech_report",
              "estimated_valve_opening",
              "air_terminal_poll_interval",
              "parse_link_quality_report",
          }
          constants = {"_TECH_FIELDS", "_LINK_FIELDS"}
          nodes = []
          for node in source.body:
              if isinstance(node, ast.FunctionDef) and node.name in wanted:
                  nodes.append(node)
              elif isinstance(node, ast.Assign) and any(
                  isinstance(t, ast.Name) and t.id in constants for t in node.targets
              ):
                  nodes.append(node)
          assert len(nodes) == 11, [getattr(n, "name", "?") for n in nodes]
          namespace = {
              "re": re, "ET": ET,
              "CONF_AIR_TERMINAL_POLL_INTERVAL": "air_terminal_poll_interval",
              "DEFAULT_AIR_TERMINAL_POLL_INTERVAL": 120,
              "MIN_AIR_TERMINAL_POLL_INTERVAL": 5,
              "MAX_AIR_TERMINAL_POLL_INTERVAL": 600,
          }
          exec(compile(ast.Module(body=nodes, type_ignores=[]), str(path), "exec"), namespace)
          payload = (b'<LL Code="200" value="Serial:0123456789ABCDEF;Pos:2364;'
                     b'RequestedPercent:0;DestinationPercent:0;BatteryPowered:0;'
                     b'RefDriveState:successful;Batt[%]:127;"/>')
          text = namespace["parse_device_report_response"](payload)
          assert text is not None
          values = namespace["parse_valve_tech_report"](text)
          assert values["motor_steps"] == 2364, values
          assert values["requested_percent"] == 0, values
          assert values["reference_state"] == "successful", values
          assert values["battery_powered"] is False, values
          assert "battery_level" not in values, values
          assert namespace["parse_valve_tech_report"]("WkupCnt[]:18;")["wake_count"] == 18
          assert namespace["air_terminal_poll_interval"]({}) == 120
          assert namespace["air_terminal_poll_interval"]({"air_terminal_poll_interval": 5}) == 5
          assert namespace["air_terminal_poll_interval"]({"air_terminal_poll_interval": 7.5}) == 120
          position_fn = namespace["estimated_valve_opening"]
          stable = {"motor_steps": 0, "max_steps": 2227, "valve_busy": False,
                    "drive_busy": False, "reference_state": "successful",
                    "error_count": 0}
          assert position_fn(stable) == 100
          stable["motor_steps"] = 1114
          assert position_fn(stable) == 50
          stable["valve_busy"] = True
          assert position_fn(stable) is None
          assert namespace["parse_device_report_response"](b'<LL Code="401" value="x"/>') is None
          assert namespace["_device_serial"]("01:23:45:67:89:AB:CD:EF") == "0123456789ABCDEF"
          air_device_serial = namespace["_air_device_serial"]
          config_ip = ET.Element("C", {"IP": "FE80000000000000524F94FFFE000001"})
          assert air_device_serial(config_ip) == "504F94FFFE000001"
          assert air_device_serial(ET.Element("C", {"IP": "fe80::524f:94ff:fe00:0002"})) == "504F94FFFE000002"
          assert air_device_serial(ET.Element("C", {"IP": "20010DB800000000524F94FFFE000001"})) is None
          link = "Target: 01:23:45:67:89:AB:CD:EF;AvgRssiRx: -83;AvgLqiRx %: 97;ErrorRate %: 0;"
          quality = namespace["parse_link_quality_report"](link)
          assert quality == {"rssi_rx": -83.0, "lqi_rx": 97.0, "error_rate": 0.0}, quality
          ready = namespace["tech_report_confirms_awake"]
          assert ready("Serial:0123456789ABCDEF;BatteryPowered:1;", "0123456789ABCDEF")
          assert not ready("timeout", "0123456789ABCDEF")
          assert not ready("Serial:FEDCBA9876543210;", "0123456789ABCDEF")
          # The DriveTo helper imports HA's exception type inside the function,
          # so simulate that dependency in the isolated AST smoke test.
          import sys
          import types
          homeassistant = types.ModuleType("homeassistant")
          exceptions = types.ModuleType("homeassistant.exceptions")
          exceptions.HomeAssistantError = RuntimeError
          sys.modules["homeassistant"] = homeassistant
          sys.modules["homeassistant.exceptions"] = exceptions
          reply = namespace["parse_drive_to_response"]
          serial = "0123456789ABCDEF"
          control = "dev/sys/wsdevice/0123456789ABCDEF/DriveTo/50"
          assert reply(f'<LL control="{control}" Code="200" value="ok"/>'.encode(), serial, 50) == "ok"
          for value, code in [("timeout", "200"), ("Unknown Func", "200"), ("ok", "401")]:
              try:
                  reply(f'<LL control="{control}" Code="{code}" value="{value}"/>'.encode(), serial, 50)
              except RuntimeError:
                  pass
              else:
                  raise AssertionError("DriveTo accepted a non-acknowledged command")
          try:
              reply(b'<LL control="dev/sys/wsdevice/FEDCBA9876543210/DriveTo/50" value="ok" Code="200"/>', serial, 50)
          except RuntimeError:
              pass
          else:
              raise AssertionError("DriveTo accepted an incorrect device")
          wake_source = ast.parse(Path("custom_components/loxone/air_command_queue.py").read_text(encoding="utf-8"))
          wake_function = next(
              node for node in wake_source.body
              if isinstance(node, ast.FunctionDef) and node.name == "wake_counter_from_tech_report"
          )
          wake_namespace = {"re": re}
          exec(compile(ast.Module(body=[wake_function], type_ignores=[]), "queue.py", "exec"), wake_namespace)
          wake_value = wake_namespace["wake_counter_from_tech_report"]
          assert wake_value("Serial:0123456789ABCDEF;WkupCnt[]:19;") == 19
          assert wake_value("Serial:0123456789ABCDEF;") is None
          print("Air XML reports, wake counter, readiness guard and DriveTo parsing passed.")
          PY
