name: Publish PyLoxoneExtended b12 pre-release (restore Audio and Valve Air)

on:
  push:
    branches: [release/restore-audio-valve-2026.11.0b12]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pyloxone-b12
  cancel-in-progress: false

jobs:
  test-and-publish:
    if: github.repository == 'darkjumpy/PyLoxoneExtended'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Verify version, code and test files
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q custom_components/loxone tests
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('custom_components/loxone')
          assert json.loads((root / 'manifest.json').read_text())['version'] == '2026.11.0b12'
          assert Path('docs/release-2026.11.0b12.md').is_file()
          assert Path('tests/test_audio_valve_endpoint_upgrade.py').is_file()
          assert 'config_entry.runtime_data = self.api' in (root / 'coordinator.py').read_text()
          assert 'runtime_data' in (root / 'valve_air.py').read_text()
          assert 'urlsplit' in (root / 'audio_client.py').read_text()
          assert '_validated_loxone_https_redirect' in (root / 'pyloxone_api' / 'loxone_http_client.py').read_text()
          print('b12 release metadata, audio/valve code and b11 redirect retained')
          PY

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Execute endpoint, audio, air valve and reconnect regression tests
        run: |
          python -m pytest -q \
            tests/test_audio_valve_endpoint_upgrade.py \
            tests/test_https_redirect_recovery.py \
            tests/test_reconnect_recovery.py \
            tests/test_connection_unit.py \
            tests/test_audio_metadata_extended.py \
            tests/test_fan_alarm_media.py \
            tests/test_air_valve_extended.py \
            tests/test_air_visualized_controls.py \
            tests/test_config_flow_reauth.py \
            tests/test_unload_cleanup.py

      - name: Publish immutable b12 pre-release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=2026.11.0b12
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists; refusing to overwrite"
            exit 1
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::Tag $TAG already exists; refusing to move"
            exit 1
          fi
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "PyLoxoneExtended 2026.11.0b12 — Audio & Valve Air endpoint recovery" \
            --notes-file docs/release-2026.11.0b12.md \
            --prerelease \
            --latest=false
          ACTUAL="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '.object.sha')"
          if [[ "$ACTUAL" != "$GITHUB_SHA" ]]; then
            echo "::error::Release target SHA mismatch: $ACTUAL != $GITHUB_SHA"
            exit 1
          fi
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json tagName,isPrerelease,url --jq '{tag: .tagName, prerelease: .isPrerelease, url: .url}'
